[versions]
kotlin = "2.0.21"
fabric-loom = "1.8-SNAPSHOT"
iridium = "3.3.2"

modmenu = "11.0.3"
emi = "1.1.18+1.21.1"
voided-variance = "1.1.1"
farmers-delight = "1.21.1-3.0.1+refabricated"
#cinderscapes = "5.0.2"

[libraries]
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
emi = { module = "dev.emi:emi-fabric", version.ref = "emi" }
voided-variance = { module = "maven.modrinth:voided-variance", version.ref = "voided-variance" }
farmers-delight = { module = "vectorwing:FarmersDelight", version.ref = "farmers-delight" }
#cinderscapes = { module = "com.terraformersmc:cinderscapes", version.ref = "cinderscapes" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
iridium = { id = "org.teamvoided.iridium", version.ref = "iridium" }
iridium-publish = { id = "iridium.project.publish-script", version.ref = "iridium" }
iridium-upload = { id = "iridium.mod.upload-script", version.ref = "iridium" }
